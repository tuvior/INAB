services:
  inab:
    build:
      context: .
    # image: inab:latest
    container_name: inab
    restart: unless-stopped
    ports:
      - "${INAB_PORT:-8000}:8000"
    env_file: ".env"
    environment:
      INAB_BACKEND: "${INAB_BACKEND:-ynab}"
      INAB_DATA_DIR: "/data"
      INAB_DATABASE_PATH: "${INAB_DATABASE_PATH:-}"
      ACTUAL_DATA_DIR: "${ACTUAL_DATA_DIR:-/data/actual-cache}"
    volumes:
      - inab-data:/data

volumes:
  inab-data:
