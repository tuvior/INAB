<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}INAB{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_path_for('static', path='/inab-logo.png') }}">
    <link rel="stylesheet" href="{{ url_path_for('static', path='/app.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_path_for('index') }}">
        <img class="brand-logo" src="{{ url_path_for('static', path='/inab-logo.png') }}" alt="" aria-hidden="true">
        <span>INAB</span>
      </a>
      <nav class="nav">
        <a href="{{ url_path_for('index') }}">Import</a>
        <a href="{{ url_path_for('import_history') }}">History</a>
        <a href="{{ url_path_for('rules') }}">Rules</a>
        <a href="{{ url_path_for('setup') }}">Setup</a>
        {% if request.session.get('authenticated') %}
          <form method="post" action="{{ url_path_for('logout') }}">
            <button class="link-button" type="submit">Log out</button>
          </form>
        {% endif %}
      </nav>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_path_for('static', path='/app.js') }}"></script>
  </body>
</html>
