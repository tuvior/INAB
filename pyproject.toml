[project]
name = "inab"
version = "0.1.0"
description = "Self-hosted CAMT.053 importer for YNAB, Actual Budget, and Swiss bank exports"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "actualpy>=0.22.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
    "ynab==4.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[project.scripts]
inab = "inab.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
